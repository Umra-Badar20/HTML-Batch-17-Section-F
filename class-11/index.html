<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
</head>

<body>


    <h1>Table</h1>

    <table border="5">
        <tr>
            <td>A</td>
            <td>B</td>
            <td>C</td>
            <td>D</td>
        </tr>
        <tr>
            <td>E</td>
            <td>F</td>
            <td>G</td>
            <td>H</td>
        </tr>
    </table>



    <hr>

    <table>
        <tr>
            <th></th>
            <th>Saturday</th>
            <th>Sunday</th>
        </tr>

        <tr>
            <th>Tickets sold:</th>
            <td>120</td>
            <td>135</td>
        </tr>

        <tr>
            <th>Total Sales</th>
            <td>$600</td>
            <td>$675</td>
        </tr>

    </table>


    <hr>

    <table border="5">
        <tr>
            <th></th>
            <th>9am</th>
            <th>10am</th>
            <th>11am</th>
            <th>12am</th>
        </tr>

        <tr>
            <th>Tuesday</th>
            <td colspan="2">HTML</td>
            <td>CSS</td>
            <td>JAVAscript</td>
        </tr>

        <tr>
            <th>Thursday</th>
            <td colspan="3">Ethics</td>
            <td>JAVAscript</td>
        </tr>

    </table>


    <hr>


    <table border="2">
        <tr>
            <th></th>
            <th>ABC</th>
            <th>BBC</th>
            <th>CNN</th>
        </tr>

        <tr>
            <th>6pm-7pm</th>
            <td rowspan="2">Movie</td>
            <td colspan="2" rowspan="2">News</td>
            <!-- <td rowspan="2">News</td> -->
        </tr>

        <tr>
            <th>7pm-8pm</th>

        </tr>
    </table>

        <tfoot bgcolor="blue">
