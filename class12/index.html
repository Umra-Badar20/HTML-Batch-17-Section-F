<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
</head>
<body>
    <h1>Forms</h1>
    <form>
        <p>
            First Name:
            <input type="text" name="fname" size="50" maxlength="5" placeholder="Enter your name" value="Sana">
        </p>
        <p>
            Last Name :
            <input type="text" name="" id="">
        </p>
        <p>
            Contact Number:
            <input type="number" maxlength="5" placeholder="+92 123456789">
        </p>
        <p>
            Password:
            <input type="password" maxlength="5" >
        </p>
        <p>
            Email:
            <input type="email" placeholder="abc@gmail.com">
        </p>
        <p>
            DOB:
            <input type="date" >
        </p>
        <p>
            Color:
            <input type="color" name="" id="">
        </p>
        <p>
            What do you think?<br>
            <textarea name="comments" id="comments" rows="4" cols="20" placeholder="Enter your comments here:"></textarea>
        </p>
        <p>
            Gender <br>
            <input type="radio" name="gender" value="male" id="">Male
            <input type="radio" name="gender" value="female" checked id="">Female
            <input type="radio" name="gender" value="other" id="">Other
        </p>
        <p>
            Select your Subjects <br>
            <input type="checkbox" name="subjects" value="eng" id="">English
            <input type="checkbox" name="subjects" value="urd" id="">Urdu
            <input type="checkbox" name="subjects" value="mth" id="">Math
        </p>
    </form>
</body>
</html>
